name: Basic CI (Level 1)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  basic-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies cleanly
        run: npm ci
      - name: Run unit tests
        run: npm test
