name: Quality Gate (Level 2)

on:
  push:
    branches: ['feature/**']
    paths: ['src/**', 'package*.json']
  pull_request:
    branches: [main]
    paths: ['src/**', 'package*.json']

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint source
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: quality-gate-dist
          path: dist/
          retention-days: 5
